name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install torch (CPU wheels)
        # The default PyPI wheel bundles the CUDA runtime and is several
        # gigabytes; a CI runner has no GPU and no reason to download it.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install ArcBody
        # Deliberately without the 'yolo' extra: the test suite pins the
        # perception backend to 'classic' so it never depends on downloading
        # detector weights, and installing them here would only hide that.
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check arcbody tests scripts

      - name: Types
        run: mypy arcbody

      - name: Tests
        run: pytest tests/ -q

      - name: Demo runs end to end
        # A green test suite with a broken entry point is a familiar way to
        # ship something nobody can run.
        run: python scripts/demo.py --out "$RUNNER_TEMP/demo"
