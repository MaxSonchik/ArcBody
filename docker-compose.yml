services:
  arcbody:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Switch to "[yolo]" for the production perception backend. The slim
        # default runs the classic silhouette backend, which needs a plain,
        # contrasting background.
        EXTRAS: ""
    image: arcbody:local
    container_name: arcbody
    ports:
      - "8000:8000"
    environment:
      ARCBODY_ENVIRONMENT: dev
      ARCBODY_LOG_LEVEL: INFO
      # "auto" prefers YOLO and falls back; pin it to make the choice explicit.
      ARCBODY_PERCEPTION__BACKEND: auto
      ARCBODY_EMBEDDING__DEVICE: cpu
      ARCBODY_GALLERY__DATABASE_PATH: /app/var/arcbody.sqlite3
      ARCBODY_EMBEDDING__WEIGHTS_PATH: /app/weights/arcbody.pt
    volumes:
      # Enrolled body profiles are the only state. Everything else is derived
      # and can be recomputed from the photos the caller still holds.
      - arcbody-data:/app/var
    restart: unless-stopped

volumes:
  arcbody-data:
