[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcbody"
version = "0.1.0"
description = "Body-shape embeddings and anthropometry for GenAI image/video conditioning"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "torch>=2.2",
]

[project.optional-dependencies]
# Production perception backend: YOLOv8 pose + instance segmentation. Without
# it the service falls back to the classic silhouette backend, which needs a
# plain background.
yolo = ["ultralytics>=8.2", "opencv-python-headless>=4.9"]
dev = ["pytest>=8.0", "httpx>=0.27", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
arcbody-train = "arcbody.training.train:cli"
arcbody-synth = "arcbody.training.synthetic:cli"

[tool.setuptools.packages.find]
include = ["arcbody*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:arcbody.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults. Depends(), File() and Form()
# in defaults are precisely how FastAPI declares dependencies and parameters, so
# the rule is a false positive for every route module.
"arcbody/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
